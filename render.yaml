services:
  - type: web
    name: eacyclic_backend
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn core.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ALLOWED_ORIGINS
        value: https://eacyclic.com,https://www.eacyclic.com,http://localhost:5173
      - key: ALLOWED_HOSTS
        value: .onrender.com,eacyclic.com,www.eacyclic.com,localhost,127.0.0.1
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Email / OTP Settings
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Resend API (replaces SMTP — works on Render free tier)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Eacyclic <noreply@eacyclic.com>"
