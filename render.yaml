services:
  - type: web
    name: eacyclic_backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ALLOWED_ORIGINS
        value: https://eacyclic.com,https://www.eacyclic.com,http://localhost:5173
      - key: ALLOWED_HOSTS
        value: .onrender.com,eacyclic.com,www.eacyclic.com,localhost,127.0.0.1

